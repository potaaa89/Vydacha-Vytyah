
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Vydacha_Vytyah vydacha_vytyah.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vydacha_Vytyah-Windows
          path: dist/Vydacha_Vytyah.exe
